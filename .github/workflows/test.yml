name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx fastapi pydantic python-multipart python-slugify nanoid
      - name: Run unit tests
        run: python -m pytest tests/unit -v
      - name: Run integration tests
        run: python -m pytest tests/integration -v
